name: Deploy site

on:
  push:
    branches: [main]

# scoped to the job that needs it, not the whole workflow
permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # mkdocs gh-deploy force-pushes the gh-pages branch
    steps:
      # pinned to commit SHAs (tags are mutable and this job can write).
      # both majors run on node24; v4/v5 declared the deprecated node20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: mkdocs gh-deploy --force
