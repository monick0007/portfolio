name: Deploy site

on:
  push:
    branches: [main]

# scoped to the job that needs it, not the whole workflow
permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # mkdocs gh-deploy force-pushes the gh-pages branch
    steps:
      # actions pinned to commit SHAs: tags are mutable and this job can write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: mkdocs gh-deploy --force
